name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly: the full 80-100 hour pacing check

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and simulation tests
        run: npm test
      - name: Early pacing guard
        run: npx tsx scripts/pacing-guard.ts
      - name: Production build
        run: npm run build
      - name: Browser click-through
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- e2e-out
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-out
          if-no-files-found: ignore

  pacing:
    # The first Legacy reset must open between 78 and 105 hours for the attentive bot.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full pacing run
        run: npx tsx scripts/balance-sim.ts 6600 1 5 | tee pacing.txt
      - name: Check the first reset window
        run: |
          h=$(grep -oE 'First legacy reset possible at: [0-9.]+' pacing.txt | grep -oE '[0-9.]+$')
          echo "first reset at ${h} h"
          awk -v h="$h" 'BEGIN { exit !(h >= 78 && h <= 105) }'
